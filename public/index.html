<style>
html{color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#191c20;color:#e8edf1;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding:20px;box-sizing:border-box}
form{width:100%;max-width:360px;background:#23272d;border:1px solid #343b44;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px}

button:disabled{opacity:.6}

#err{color:#ff9d8a;font-weight:600}
</style>

</form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go'),inp=document.getElementById('pw');
async function attempt(pw,silent){
  go.disabled=true;go.textContent='A abrir…';err.hidden=true;
  try{const html=await open_(pw);try{localStorage.setItem('cdh_pw',pw)}catch(e){}show(html)}
  catch(e){try{localStorage.removeItem('cdh_pw')}catch(_){}go.disabled=false;go.textContent='Abrir';
    if(!silent){err.textContent=(window.crypto&&crypto.subtle)?'Palavra-passe incorreta. Verifique e tente de novo.':'Este navegador não consegue abrir a página. Abra o endereço em https no Safari.';err.hidden=false;inp.select()}}
}
f.addEventListener('submit',e=>{e.preventDefault();attempt(inp.value.trim(),false)});
let saved=null;try{saved=localStorage.getItem('cdh_pw')}catch(e){}
if(saved)attempt(saved,true);else inp.focus();
</script>
